<app-show-errors [errors]="errors"></app-show-errors>

<form (ngSubmit)="submitForm()" [formGroup]="form">
    <mat-form-field appearance="outline">
        <mat-label>UID</mat-label>
        <input formControlName="uid" matInput />
        <mat-error *ngIf="form.get('uid')?.invalid">{{GetFieldError('uid')}}</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
        <mat-label>Vendor</mat-label>
        <input formControlName="vendor" matInput />
        <mat-error *ngIf="form.get('vendor')?.invalid">{{GetFieldError('vendor')}}</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="statusId" matInput>
            <mat-option *ngFor="let status of statusOptions" [value]="status.value">
              {{status.label}}
            </mat-option>
          </mat-select>
        <mat-error *ngIf="form.get('statusId')?.invalid">{{GetFieldError('statusId')}}</mat-error>
    </mat-form-field>
    <div>
        <button mat-flat-button color="primary" [disabled]="form.invalid">
            Save
        </button> 
    <a mat-stroked-button routerLink="/device/list/{{gatewayId}}">
        Cancel
    </a>
    </div>
</form>
